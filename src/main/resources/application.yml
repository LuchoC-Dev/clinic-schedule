spring:
  application:
    name: schedule

  # PostgreSQL, as started by docker-compose.yml (D-44). The integration tests replace it
  # with H2 in PostgreSQL mode, in src/test/resources/application.properties.
  datasource:
    url: jdbc:postgresql://localhost:5432/schedule
    username: schedule
    password: schedule

  # A file attached to a clinical record is at most 10 MB, and the record says so (D-57). The limit
  # here sits a little above it, so a file just over 10 MB still reaches the record and is refused
  # with that message; anything far larger is cut off before it is read.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate

  flyway:
    enabled: true
    # db/migration is the schema, for every environment. db/vendor/{vendor} is what only one
    # engine can express, such as PostgreSQL's exclusion constraints; Spring Boot puts the
    # engine's name in {vendor} (D-44). db/seed is development data - users, practitioners,
    # patients - and a real deployment removes it from this list (D-34).
    locations: classpath:db/migration,classpath:db/vendor/{vendor},classpath:db/seed

app:
  # The practice's fixed time zone (D-10).
  time-zone: America/Argentina/Buenos_Aires
  # The jobs that run every minute: marking absent the appointments whose patient never came
  # (D-06, D-61) and closing the queues at the end of their day (D-63). The tests turn them off.
  scheduling:
    enabled: true
  # A called patient who does not come in is passed over once and called again, this many calls in
  # all; after the last one they are taken out of the queue as not having shown up (D-63).
  arrival:
    calls-before-no-show: 3
  # How long after they last saw a patient - a consultation, or a check - a practitioner may still
  # read the patient's clinical record: an ISO-8601 period (D-49, D-53).
  clinical-record:
    access-period: P1Y
    # Access asked for to report a pending check (D-54): how long it lasts, an ISO-8601 period, and
    # whether asking needs a reason. The reason is never judged; whether it is required is for the
    # law to say, so it is a setting.
    access-grant:
      period: P1Y
      reason-required: true

logging:
  level:
    com.clinic.schedule: DEBUG
