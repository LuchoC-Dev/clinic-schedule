spring:
  application:
    name: schedule

  # H2 in PostgreSQL compatibility mode (D-03). Switching engines means changing this
  # section plus the Flyway module of the new engine, nothing else.
  datasource:
    url: jdbc:h2:mem:schedule;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # The practice's fixed time zone (D-10).
  time-zone: America/Argentina/Buenos_Aires
  # The job that cancels overdue appointments every minute (D-06). The tests turn it off.
  scheduling:
    enabled: true

logging:
  level:
    com.clinic.schedule: DEBUG
