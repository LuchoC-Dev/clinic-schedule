spring:
  application:
    name: schedule

  # PostgreSQL, as started by docker-compose.yml (D-44). The integration tests replace it
  # with H2 in PostgreSQL mode, in src/test/resources/application.properties.
  datasource:
    url: jdbc:postgresql://localhost:5432/schedule
    username: schedule
    password: schedule

  # A file attached to a clinical record is at most 10 MB, and the record says so (D-57). The limit
  # here sits a little above it, so a file just over 10 MB still reaches the record and is refused
  # with that message; anything far larger is cut off before it is read.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

  # Where the reminders are sent from (D-78): in development, Mailpit, from docker-compose.yml, which keeps
  # every message for its screen at http://localhost:8025 and sends none on. A real deployment points this
  # at its own SMTP server, with its credentials.
  mail:
    host: localhost
    port: 1025

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate

  flyway:
    enabled: true
    # db/migration is the schema, for every environment. db/vendor/{vendor} is what only one
    # engine can express, such as PostgreSQL's exclusion constraints; Spring Boot puts the
    # engine's name in {vendor} (D-44). db/seed is development data - users, practitioners,
    # patients - and a real deployment removes it from this list (D-34).
    locations: classpath:db/migration,classpath:db/vendor/{vendor},classpath:db/seed
    # The seed is numbered from 100, so a database that already has it sees every later schema
    # migration as out of order; this lets them apply. A real deployment, without db/seed, does not
    # need it and removes it with the seed (D-67).
    out-of-order: true

app:
  # The practice's fixed time zone (D-10).
  time-zone: America/Argentina/Buenos_Aires
  # The jobs: marking absent, every minute, the appointments whose patient never came (D-06, D-61),
  # closing the queues at the end of their day (D-63), and the daily reminders (D-78). The tests turn
  # them off.
  scheduling:
    enabled: true
  # A called patient who does not come in is passed over once and called again, this many calls in
  # all; after the last one they are taken out of the queue as not having shown up (D-63).
  arrival:
    calls-before-no-show: 3
  # The most a single charge may be, in pesos (D-87): an amount above it is refused, so one typed with too many
  # digits never reaches the database, whose column keeps up to 9999999999.99.
  cash-desk:
    max-amount: 99999999.99
  # How long after they last saw a patient - a consultation, or a check - a practitioner may still
  # read the patient's clinical record: an ISO-8601 period (D-49, D-53).
  clinical-record:
    access-period: P1Y
    # Access asked for to report a pending check (D-54): how long it lasts, an ISO-8601 period, and
    # whether asking needs a reason. The reason is never judged; whether it is required is for the
    # law to say, so it is a setting.
    access-grant:
      period: P1Y
      reason-required: true

  # The practice, as the reminders and the patients' accounts name it (D-78, D-79). These are development
  # values; a real deployment sets its own.
  practice:
    name: Consultorio
    address: Av. Siempre Viva 742
    phone: 011 4555-0000
  # The practice's sender, for every email it sends: the reminders and the patients' accounts.
  mail:
    from: no-responder@consultorio.local
  # Reminders by email (D-78): once a day, at this time — a Spring cron, in the practice's time zone —,
  # for every appointment still booked from tomorrow to this many days ahead, not reminded yet.
  reminders:
    cron: "0 0 10 * * *"
    days-ahead: 3
  # The patients' web accounts (D-79): where patients reach the application, which the links in their emails
  # point at, how long the link to activate an account lasts, an ISO-8601 duration, and how many days ahead a
  # patient books on the web, from tomorrow (D-82).
  portal:
    base-url: http://localhost:8080
    activation-valid-for: PT72H
    booking-days-ahead: 30
    # Up to how many hours before an appointment a patient cancels it on the web or from an email's link (D-83).
    cancel-hours-before: 24
    # How many failed logins in a row lock an account, and for how long (D-86).
    login-attempts: 5
    lock-for: PT15M
    # How long the link to choose a new password lasts, and how soon another may be sent to the same account.
    recovery-valid-for: PT1H
    recovery-every: PT5M
    # How long a registration made on the web waits for its confirmation from the email's link; one never
    # confirmed is forgotten afterwards (D-91).
    registration-valid-for: PT72H
    # How many children under 13 an account asks to register in a day, from the account (D-92).
    children-per-day: 5

logging:
  level:
    com.clinic.schedule: DEBUG
