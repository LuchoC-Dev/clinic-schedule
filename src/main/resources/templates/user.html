<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuario')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="${user.username}">recepcion</h1>
    <p class="muted">
        <span th:text="${user.role}">Recepción</span>
        <span th:if="${user.practitioner != null}" th:text="' · ' + ${user.practitioner}"> · Dra. Laura Arias</span>
        · <span th:text="${user.active} ? 'Activo' : 'Desactivado'">Activo</span>
    </p>
    <div th:replace="~{fragments :: messages}"></div>

    <h2>Acceso</h2>
    <div class="card">
        <form class="inline" method="post" th:if="${user.active}" th:action="@{/users/{id}/deactivate(id=${user.id})}">
            <button type="submit" class="danger">Desactivar</button>
            <span class="muted">Deja de poder ingresar en el acto, y se cierran sus sesiones abiertas.</span>
        </form>
        <form class="inline" method="post" th:unless="${user.active}" th:action="@{/users/{id}/reactivate(id=${user.id})}">
            <button type="submit">Reactivar</button>
        </form>
    </div>

    <h2>Blanquear la contraseña</h2>
    <form class="card bar" method="post" th:action="@{/users/{id}/password-reset(id=${user.id})}">
        <label><span th:text="'Contraseña nueva (' + ${minLength} + ' caracteres o más)'">Contraseña nueva</span>
            <input type="password" name="password" required autocomplete="new-password">
        </label>
        <button type="submit" class="primary">Blanquear</button>
    </form>

    <h2>Historial</h2>
    <p th:if="${history.isEmpty()}" class="muted">Sin acciones registradas.</p>
    <table th:unless="${history.isEmpty()}">
        <thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th></tr></thead>
        <tbody>
        <tr th:each="c : ${history}">
            <td th:text="${c.when}">lun 28/09/2026 10:00</td>
            <td th:text="${c.by}">admin</td>
            <td th:text="${c.action}">Creó el usuario</td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/users}">Volver a usuarios</a></p>
</main>
</body>
</html>
