<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sala de espera')}"></head>
<body>
<!-- A screen for the room: no header, no patient named (D-66). -->
<main class="wide">
    <h1>Sala de espera</h1>
    <div id="live">
        <p th:if="${queues.isEmpty()}" class="muted">No hay colas.</p>
        <table th:unless="${queues.isEmpty()}">
            <thead><tr><th>Cola</th><th>Consultorio</th><th></th><th>Esperan</th><th>En atención</th></tr></thead>
            <tbody>
            <tr th:each="q : ${queues}">
                <td th:text="${q.name}">Guardia</td>
                <td th:text="${q.room} ?: '—'">3</td>
                <td th:text="${q.open} ? 'Abierta' : 'Cerrada'" th:classappend="${q.open} ? '' : 'muted'">Abierta</td>
                <td th:text="${q.open} ? ${q.waiting} : '—'">4</td>
                <td th:text="${q.open} ? ${q.beingSeen} : '—'">1</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:replace="~{fragments :: live}"></script>
</body>
</html>
