<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Agenda')}"></head>
<body>
<header th:replace="~{fragments :: staffHeader}"></header>
<main>
    <!-- Whose agenda this is, said in words: the choice above can never disagree with it (D-45). -->
    <h1 th:text="${practitioner != null} ? 'Agenda de ' + ${practitioner.fullName} : 'Agenda de todos los profesionales'">Agenda</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <p th:if="${practitioners.isEmpty()}" class="muted">
        Todavía no hay profesionales cargados.
    </p>

    <form class="bar" method="get" th:action="@{/agenda}" th:unless="${practitioners.isEmpty()}">
        <label>Profesional
            <select name="practitionerId" data-refresh>
                <option value="" th:unless="${readOnly}" th:selected="${everyone}">Todos</option>
                <option th:each="p : ${practitioners}" th:value="${p.id}" th:text="${p.fullName}"
                        th:selected="${practitioner != null and p.id == practitioner.id}"></option>
            </select>
        </label>
        <label>Día
            <input type="date" name="date" th:value="${date}" data-refresh>
        </label>
        <label>Vista
            <select name="view" data-refresh>
                <option value="day" th:selected="${view == 'day'}">Día</option>
                <option value="week" th:selected="${view == 'week'}">Semana</option>
            </select>
        </label>
        <button type="submit" data-refresh-button>Ver</button>
    </form>

    <!-- Moving through days or weeks keeps the practitioner and the view. -->
    <p class="bar" th:with="whose=${practitioner?.id}">
        <a th:href="@{/agenda(practitionerId=${whose}, date=${previous}, view=${view})}"
           th:text="${view == 'week'} ? '‹ Semana anterior' : '‹ Día anterior'">‹ Anterior</a>
        <a th:href="@{/agenda(practitionerId=${whose}, date=${today}, view=${view})}">Hoy</a>
        <a th:href="@{/agenda(practitionerId=${whose}, date=${next}, view=${view})}"
           th:text="${view == 'week'} ? 'Semana siguiente ›' : 'Día siguiente ›'">Siguiente ›</a>
    </p>

    <!--
      One way to book. From a practitioner's agenda it says with whom and comes with them chosen;
      from everyone's, the practitioner is chosen on the booking screen (D-45).
    -->
    <p class="bar" th:unless="${readOnly or practitioners.isEmpty()}">
        <a th:href="${practitioner != null} ? @{/agenda/new(practitionerId=${practitioner.id}, date=${date})} : @{/agenda/new(date=${date})}">
            <button type="button" class="primary"
                    th:text="${practitioner != null} ? 'Nuevo turno con ' + ${practitioner.fullName} : 'Nuevo turno'">Nuevo turno</button>
        </a>
    </p>

    <section th:each="day : ${days}">
        <h2 th:text="${day.label}">martes 10/03</h2>
        <p th:if="${day.rows.isEmpty()}" class="muted">No hay turnos reservados.</p>

        <table th:unless="${day.rows.isEmpty()}">
            <thead>
            <tr>
                <th>Horario</th>
                <th th:if="${everyone}">Profesional</th>
                <th>Paciente</th><th>Razón</th><th>Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${day.rows}">
                <td th:text="${row.startsAt} + ' – ' + ${row.endsAt}">10:00 – 10:30</td>
                <td th:if="${everyone}" th:text="${row.practitioner}">Dra. Laura Arias</td>
                <td>
                    <!-- A practitioner reads the record of today's patients, even before they arrive (D-49). -->
                    <a th:if="${readOnly and row.date == today}"
                       th:href="@{/clinical-records/{id}(id=${row.patientId})}" th:text="${row.patient}">Ana Pérez</a>
                    <span th:if="${readOnly and row.date != today}" th:text="${row.patient}">Ana Pérez</span>
                    <a th:unless="${readOnly}" th:href="@{/agenda/patients/{id}(id=${row.patientId})}"
                       th:text="${row.patient}">Ana Pérez</a>
                    <div class="muted" th:if="${row.note}" th:text="${row.note}"></div>
                </td>
                <td><span th:text="${row.reason}">consulta</span>
                    <!-- Booked by the patient on the web (D-82), or moved there (D-93). -->
                    <span class="muted" th:if="${row.web}">· Web</span>
                    <span class="muted" th:if="${row.movedOnWeb}">· Movido por la web</span></td>
                <td th:text="${row.state}">Reservado</td>
                <td class="actions" th:if="${readOnly}">
                    <!-- The consultation starts from the queue, when the patient is called (D-63, D-65). -->
                    <a th:if="${row.arrived and row.date == today}" th:href="@{/my-queue}">En tu cola</a>
                </td>
                <td class="actions" th:unless="${readOnly}">
                    <!-- An absent appointment is a record: nothing more happens to it (D-61). -->
                    <th:block th:if="${row.booked}">
                    <!--
                      The arrival is the queues': the patient comes into their practitioner's queue (D-65), charged
                      in the same step (D-87), or covered by their insurance (D-90).
                    -->
                    <form class="inline" method="post" th:unless="${row.arrived}"
                          th:action="@{/arrivals/appointment-arrivals/{id}(id=${row.id})}">
                        <input type="hidden" name="practitionerId" th:value="${practitioner?.id}">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="view" th:value="${view}">
                        <input type="number" name="amount" step="0.01" min="0.01" placeholder="Importe $ o coseguro"
                               aria-label="Importe, o coseguro con cobertura">
                        <select th:replace="~{fragments :: meansSelect}"></select>
                        <th:block th:replace="~{fragments :: coverageFields}"></th:block>
                        <button type="submit" class="primary">Llegó</button>
                    </form>
                    <form class="inline" method="post" th:unless="${row.arrived or row.lateNotice}"
                          th:action="@{/agenda/appointments/{id}/late-notice(id=${row.id})}">
                        <input type="hidden" name="practitionerId" th:value="${practitioner?.id}">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="view" th:value="${view}">
                        <button type="submit">Avisó demora</button>
                    </form>
                    <a th:unless="${row.arrived}" th:href="@{/agenda/appointments/{id}/reschedule(id=${row.id})}">
                        <button type="button">Mover</button>
                    </a>
                    <!-- Who asked for it is required, the note is not (D-76). -->
                    <form class="inline" method="post"
                          th:action="@{/agenda/appointments/{id}/cancel(id=${row.id})}">
                        <input type="hidden" name="practitionerId" th:value="${practitioner?.id}">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="view" th:value="${view}">
                        <select name="requestedBy" required aria-label="Quién pidió la cancelación">
                            <option value="">Lo pidió…</option>
                            <option value="PATIENT">el paciente</option>
                            <option value="PRACTICE">el consultorio</option>
                        </select>
                        <input type="text" name="note" maxlength="200" placeholder="Nota (opcional)"
                               aria-label="Nota de la cancelación">
                        <button type="submit" class="danger">Cancelar</button>
                    </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:replace="~{fragments :: refresh}"></script>
</body>
</html>
