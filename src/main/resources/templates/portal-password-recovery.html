<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Recuperar tu contraseña')}"></head>
<body>
<main style="max-width: 22rem">
    <h1>Recuperar tu contraseña</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <p class="muted">Te mandamos un link al email de tu cuenta para elegir una contraseña nueva.</p>
    <form class="card" method="post" th:action="@{/portal/password-recovery}">
        <p><label>Tipo de documento
            <select name="documentType" required>
                <option th:each="t : ${documentTypes}" th:value="${t}" th:text="${t}">DNI</option>
            </select>
        </label></p>
        <p><label>Número
            <input type="text" name="documentNumber" autocomplete="username" required autofocus maxlength="20">
        </label></p>
        <button type="submit" class="primary">Mandame el link</button>
    </form>
    <p><a th:href="@{/portal/login}">Ingresar</a></p>
</main>
</body>
</html>
