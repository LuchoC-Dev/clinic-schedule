<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nuevo turno')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="'Nuevo turno con ' + ${practitioner.fullName}">Nuevo turno</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <!-- Step 1: day, reason and patient search. Refreshing with GET brings suggestions and matches. -->
    <form class="card bar" method="get" th:action="@{/agenda/new}">
        <input type="hidden" name="practitionerId" th:value="${practitioner.id}">
        <label>Día
            <input type="date" name="date" th:value="${date}">
        </label>
        <label>Razón
            <select name="reasonId">
                <option value="">— elegir —</option>
                <option th:each="r : ${practitioner.reasons}" th:value="${r.id}"
                        th:text="${r.name} + ' (' + ${r.durationMinutes} + ' min)'"
                        th:selected="${r.id == reasonId}"></option>
            </select>
        </label>
        <label>Buscar paciente
            <input type="text" name="patientQuery" th:value="${patientQuery}" placeholder="nombre o documento">
        </label>
        <button type="submit">Actualizar</button>
        <a th:href="@{/patients}">Registrar paciente nuevo</a>
    </form>

    <p th:if="${reasonId == null}" class="muted">Elegí la razón para ver los horarios libres.</p>

    <!-- Step 2: choose the patient and the time, and book. -->
    <form class="card" method="post" th:action="@{/agenda/new}" th:if="${reasonId != null}">
        <input type="hidden" name="practitionerId" th:value="${practitioner.id}">
        <input type="hidden" name="date" th:value="${date}">
        <input type="hidden" name="reasonId" th:value="${reasonId}">

        <h2>Paciente</h2>
        <p th:if="${patientQuery == null}" class="muted">Buscá al paciente arriba.</p>
        <p th:if="${patientQuery != null and patients.isEmpty()}" class="muted">No hay pacientes que coincidan.</p>
        <div class="choices">
            <label th:each="p : ${patients}">
                <input type="radio" name="patientId" th:value="${p.id}">
                <span th:text="${p.document == null} ? ${p.fullName} : ${p.fullName} + ' — ' + ${p.document}"></span>
            </label>
        </div>

        <h2>Horario</h2>
        <p th:if="${suggestions.isEmpty()}" class="muted">No quedan horarios libres ese día para esta razón.</p>
        <div class="choices">
            <label th:each="t : ${suggestions}">
                <input type="radio" name="time" th:value="${t}"><span th:text="${t}"></span>
            </label>
        </div>
        <p>
            <label>…u otra hora
                <input type="time" name="otherTime">
            </label>
        </p>

        <label>Nota (opcional)
            <textarea name="note" rows="2" maxlength="500"></textarea>
        </label>
        <p><button type="submit" class="primary">Reservar</button>
            <a th:href="@{/agenda(practitionerId=${practitioner.id}, date=${date})}">Volver</a></p>
    </form>
</main>
</body>
</html>
