<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Elegir una contraseña nueva')}"></head>
<body>
<main style="max-width: 22rem">
    <h1>Elegí una contraseña nueva</h1>
    <p class="error" th:unless="${usable}">Este link ya no sirve: venció, ya se usó o pediste otro después. Pedí uno
        nuevo desde <a th:href="@{/portal/password-recovery}">recuperar tu contraseña</a>.</p>
    <th:block th:if="${usable}">
        <div th:replace="~{fragments :: messages}"></div>
        <p class="muted">De 10 a 72 caracteres, los que quieras.</p>
        <form class="card" method="post" th:action="@{/portal/password-reset}">
            <input type="hidden" name="token" th:value="${token}">
            <p><label>Contraseña nueva
                <input type="password" name="password" autocomplete="new-password" required minlength="10">
            </label></p>
            <p><label>Repetila
                <input type="password" name="repeatedPassword" autocomplete="new-password" required minlength="10">
            </label></p>
            <button type="submit" class="primary">Guardar</button>
        </form>
    </th:block>
    <p><a th:href="@{/portal/login}">Ingresar</a></p>
</main>
</body>
</html>
