<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared pieces of the screens. The screens are thin and throwaway (D-02): plain HTML, a few
  lines of CSS, no JavaScript. On-screen text is in Spanish, for the staff (D-13).
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Consultorio'">Consultorio</title>
    <style>
        :root { --ink: #1f2933; --muted: #616e7c; --line: #d9e2ec; --accent: #2f6f8f; --ok: #276749; --bad: #9b2c2c; }
        * { box-sizing: border-box; }
        body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: #f7f9fb; }
        header { background: #fff; border-bottom: 1px solid var(--line); padding: .6rem 1.2rem; display: flex; gap: 1.2rem; align-items: center; }
        header strong { margin-right: auto; }
        header a { color: var(--accent); text-decoration: none; }
        main { max-width: 64rem; margin: 1.2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.3rem; margin: 0 0 1rem; }
        h2 { font-size: 1.05rem; margin: 1.5rem 0 .6rem; }
        .ok, .error { padding: .55rem .8rem; border-radius: 6px; margin: 0 0 1rem; }
        .ok { background: #e6f4ea; color: var(--ok); }
        .error { background: #fdecea; color: var(--bad); }
        form.inline { display: inline; }
        .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; margin-bottom: 1rem; }
        label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: .2rem; }
        input, select, textarea, button { font: inherit; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
        button { cursor: pointer; }
        button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        button.danger { color: var(--bad); }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
        th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: .8rem; color: var(--muted); font-weight: 600; }
        td.actions { white-space: nowrap; }
        .muted { color: var(--muted); }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .choices { display: flex; flex-wrap: wrap; gap: .4rem; }
        .choices label { flex-direction: row; align-items: center; gap: .3rem; border: 1px solid var(--line); border-radius: 5px; padding: .25rem .5rem; background: #fff; color: var(--ink); }
        main.wide { max-width: 84rem; }
        .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
        .columns textarea { width: 100%; }
        .columns td.kind { width: 11rem; }
        .notes { white-space: pre-wrap; margin: .3rem 0; }
        .addendum { border-left: 3px solid var(--line); padding-left: .8rem; margin: .6rem 0; }
        .check { border-left: 3px solid var(--accent); padding-left: .8rem; margin: .6rem 0; }
        .order { border-left: 3px dashed var(--accent); padding-left: .8rem; margin: .6rem 0; }
        ul.files { margin: .4rem 0; }
        form.attach { display: flex; gap: .6rem; align-items: center; margin: .4rem 0; }
        details.card summary { cursor: pointer; color: var(--accent); }
        .card textarea { width: 100%; }
        @media (max-width: 50rem) { .columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<!--
  The staff's header. Named apart from the element: a selector "header" would also take every <header> here,
  the patients' included.
-->
<header th:fragment="staffHeader">
    <strong>Consultorio</strong>
    <!--
      admin is set on the admins' screens: they administer the users (D-68), read who read which
      clinical record (D-71) and who was refused one (D-72), and the cancellations without their
      patients (D-76), and reach nothing else.
    -->
    <a th:href="@{/users}" th:if="${admin}">Usuarios</a>
    <a th:href="@{/record-readings}" th:if="${admin}">Lecturas</a>
    <a th:href="@{/record-refusals}" th:if="${admin}">Rechazos</a>
    <a th:href="@{/cancellation-log}" th:if="${admin}">Cancelaciones</a>
    <th:block th:unless="${admin}">
    <a th:href="@{/agenda}">Agenda</a>
    <!--
      readOnly is set on a practitioner's screens: they read their agenda (D-34) and work with
      clinical records, reported through the list of pending results (D-54) and followed up through
      their own orders (D-56).
    -->
    <a th:href="@{/my-queue}" th:if="${readOnly}">Mi cola</a>
    <a th:href="@{/checks/pending}" th:if="${readOnly}">Resultados pendientes</a>
    <a th:href="@{/orders/mine}" th:if="${readOnly}">Mis órdenes</a>
    <a th:href="@{/patients}" th:unless="${readOnly}">Pacientes</a>
    <a th:href="@{/practitioners}" th:unless="${readOnly}">Profesionales</a>
    <a th:href="@{/arrivals}" th:unless="${readOnly}">Llegadas</a>
    <a th:href="@{/waiting-room}" th:unless="${readOnly}" target="_blank">Sala de espera</a>
    <a th:href="@{/queues}" th:unless="${readOnly}">Colas</a>
    <a th:href="@{/cancellations}" th:unless="${readOnly}">Cancelaciones</a>
    <a th:href="@{/reminders}" th:unless="${readOnly}">Recordatorios</a>
    </th:block>
    <a th:href="@{/password}">Contraseña</a>
    <form class="inline" method="post" th:action="@{/logout}">
        <button type="submit">Salir</button>
    </form>
</header>
<!--
  The patients' header, on their own screens (D-80): their appointments, booking one (D-82), their family
  (D-85), their data (D-81), their password (D-86) and logging out, and nothing of the staff's.
-->
<header th:fragment="portalHeader">
    <strong>Consultorio</strong>
    <a th:href="@{/portal/appointments}">Mis turnos</a>
    <a th:href="@{/portal/booking}">Sacar turno</a>
    <a th:href="@{/portal/family}">Mi familia</a>
    <a th:href="@{/portal/profile}">Mis datos</a>
    <a th:href="@{/portal/password}">Contraseña</a>
    <form class="inline" method="post" th:action="@{/portal/logout}">
        <button type="submit">Salir</button>
    </form>
</header>
<div th:fragment="messages">
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>
<!--
  A field marked data-refresh sends its form as soon as it changes, through the form's button
  marked data-refresh-button when it has one. What is on screen then always matches what was
  chosen; without JavaScript, the button does the same (D-36, D-45).
-->
<script th:fragment="refresh">
    document.querySelectorAll('[data-refresh]').forEach(field =>
        field.addEventListener('change', () =>
            field.form.requestSubmit(field.form.querySelector('[data-refresh-button]') || undefined)));
</script>
<!--
  The region marked id="live" is shown again whenever the queue it names in data-queue changes, or
  any queue when it names none: the server says so through Server-Sent Events, and the page asks for
  itself again and swaps that region alone, so whatever is typed outside it stays (D-66). The browser
  opens the stream again by itself when it closes. Without JavaScript, reloading does the same.

  A screen never goes on showing what it no longer knows: when the page asked for is not this screen —
  the session ran out and the login came back, or an error page — or the stream fails for good, the
  whole page is loaded again, and shows whatever the answer is.
-->
<script th:fragment="live">
    (() => {
        const region = document.getElementById('live');
        if (!region || !window.EventSource) {
            return;
        }
        const queue = region.dataset.queue;
        let refreshing = false;
        const stream = new EventSource('/queue-events');
        stream.addEventListener('error', () => {
            if (stream.readyState === EventSource.CLOSED) {
                location.reload();
            }
        });
        stream.addEventListener('queue', event => {
            if ((queue && event.data !== queue) || refreshing) {
                return;
            }
            refreshing = true;
            fetch(location.href, {credentials: 'same-origin'})
                .then(response => response.text())
                .then(html => {
                    const fresh = new DOMParser().parseFromString(html, 'text/html').getElementById('live');
                    if (fresh) {
                        region.innerHTML = fresh.innerHTML;
                    } else {
                        location.reload();
                    }
                })
                .finally(() => refreshing = false);
        });
    })();
</script>
</body>
</html>
