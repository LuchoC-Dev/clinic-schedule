<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sacar turno')}"></head>
<body>
<header th:replace="~{fragments :: portalHeader}"></header>
<main>
    <h1>Sacar turno</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <p th:if="${reasons.isEmpty()}" class="muted">Por ahora no hay turnos para sacar por la web: llamá o acercate a
        recepción.</p>
    <form class="card bar" method="get" th:action="@{/portal/booking}" th:unless="${reasons.isEmpty()}">
        <label th:if="${whom.size() > 1}">Para
            <select name="patient">
                <option th:each="p, i : ${whom}" th:value="${p.patientId}" th:selected="${p.patientId == patient}"
                        th:text="${i.first} ? ${p.fullName} + ' (vos)' : ${p.fullName}">Laura Medina (vos)</option>
            </select>
        </label>
        <label>Profesional y motivo
            <select name="reason" required>
                <option th:each="r : ${reasons}" th:value="${r.reasonId}" th:selected="${r.reasonId == reason}"
                        th:text="${r.practitionerName} + ' — ' + ${r.reasonName}">Dra. Arias — consulta</option>
            </select>
        </label>
        <label>Día
            <input type="date" name="date" required th:min="${firstDay}" th:max="${lastDay}" th:value="${date}">
        </label>
        <button type="submit">Ver horarios</button>
    </form>
    <p class="muted" th:unless="${reasons.isEmpty()}"
       th:text="'Desde mañana y hasta el ' + ${lastDayLabel} + '. Para hoy, llamá o acercate a recepción.'">
        Desde mañana y hasta el 9/04/2026.</p>

    <th:block th:if="${times != null}">
        <h2 th:text="${chosen.practitionerName} + ', ' + ${day}">Dra. Arias, jueves 12/03/2026</h2>
        <p th:if="${times.isEmpty()}" class="muted">No quedan horarios libres ese día: probá con otro.</p>
        <div class="choices">
            <form class="inline" method="post" th:action="@{/portal/booking}" th:each="t : ${times}">
                <input type="hidden" name="reason" th:value="${chosen.reasonId}">
                <input type="hidden" name="patient" th:value="${patient}">
                <input type="hidden" name="startsAt" th:value="${date} + 'T' + ${t}">
                <button type="submit" th:text="${t}">10:00</button>
            </form>
        </div>
    </th:block>
</main>
</body>
</html>
