<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Copias para retirar')}"></head>
<body>
<header th:replace="~{fragments :: staffHeader}"></header>
<main>
    <h1>Copias para retirar</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <p class="muted">
        Copias de la historia clínica en papel, en sobre cerrado. Se entregan a quien las pidió, con su documento a la vista.
    </p>

    <p th:if="${rows.isEmpty()}" class="muted">No hay copias para retirar.</p>

    <!-- Whose and who asked: never what the envelope holds (D-51, D-95). -->
    <table th:unless="${rows.isEmpty()}">
        <thead>
        <tr><th>Paciente</th><th>La pidió</th><th>Lista desde</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.patient}">Ana Pérez — DNI 30111222</td>
            <td th:text="${row.requestedBy}">El paciente</td>
            <td th:text="${row.authenticatedAt}">12/10/2026 11:00</td>
            <td>
                <form method="post" th:action="@{/record-copy-envelopes/{id}/handover(id=${row.id})}">
                    <label><input type="checkbox" name="documentSeen" value="true"> Vi el documento de quien la retira</label>
                    <p class="bar"><button type="submit" class="primary">Entregar</button></p>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
