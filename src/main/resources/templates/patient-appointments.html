<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Turnos del paciente')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="'Turnos de ' + ${patient.fullName}">Turnos de Ana Pérez</h1>
    <p class="muted" th:if="${patient.document}" th:text="${patient.document}">DNI 30111222</p>
    <div th:replace="~{fragments :: messages}"></div>

    <p th:if="${rows.isEmpty()}" class="muted">Este paciente todavía no tiene turnos.</p>
    <table th:unless="${rows.isEmpty()}">
        <thead>
        <tr><th>Día</th><th>Horario</th><th>Profesional</th><th>Razón</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.dayLabel()}">mar 10/03/2026</td>
            <td th:text="${row.startsAt} + ' – ' + ${row.endsAt}">10:00 – 10:30</td>
            <td th:text="${row.practitioner}">Dra. Laura Arias</td>
            <td>
                <span th:text="${row.reason}">consulta</span>
                <div class="muted" th:if="${row.note}" th:text="${row.note}"></div>
            </td>
            <td>
                <span th:text="${row.state}">Reservado</span>
                <!-- Who cancelled it, when, how and who asked, and reception's note (D-76). -->
                <div class="muted" th:if="${row.cancellation}" th:text="${row.cancellation}">
                    Por recepcion el mié 30/09/2026 10:15 · lo pidió el paciente</div>
                <div class="muted" th:if="${row.cancellationNote}" th:text="'Nota: ' + ${row.cancellationNote}"></div>
            </td>
            <td>
                <a th:if="${row.booked}"
                   th:href="@{/agenda(practitionerId=${row.practitionerId}, date=${row.date})}">Ver en la agenda</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/patients}">Volver a pacientes</a></p>
</main>
</body>
</html>
