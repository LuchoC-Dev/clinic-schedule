<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Colas')}"></head>
<body>
<header th:replace="~{fragments :: staffHeader}"></header>
<main>
    <h1>Colas</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <p th:if="${queues.isEmpty()}" class="muted">Todavía no hay colas.</p>
    <table th:unless="${queues.isEmpty()}">
        <thead><tr><th>Cola</th><th>Consultorio</th><th>Profesionales</th><th></th></tr></thead>
        <tbody>
        <tr th:each="q : ${queues}">
            <td th:text="${q.name}">Guardia</td>
            <td th:text="${q.room} ?: '—'">3</td>
            <td>
                <span th:if="${q.practitioners.isEmpty()}" class="muted">Nadie la atiende</span>
                <span th:each="p, it : ${q.practitioners}" th:text="${p.fullName} + (${it.last} ? '' : ', ')">Dra. Laura Arias</span>
            </td>
            <td class="actions"><a th:href="@{/queues/{id}(id=${q.id})}">Editar</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Nueva cola</h2>
    <form class="card bar" method="post" th:action="@{/queues}">
        <label>Nombre
            <input type="text" name="name" required maxlength="60" placeholder="Consultorio 3, Guardia…">
        </label>
        <label>Consultorio
            <input type="text" name="room" maxlength="20" placeholder="opcional">
        </label>
        <button type="submit" class="primary">Crear</button>
    </form>
</main>
</body>
</html>
