<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contraseña')}"></head>
<body>
<header th:replace="~{fragments :: portalHeader}"></header>
<main>
    <h1>Cambiar tu contraseña</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <form class="card" method="post" th:action="@{/portal/password}" style="max-width: 22rem">
        <p><label>Contraseña actual
            <input type="password" name="currentPassword" autocomplete="current-password" required>
        </label></p>
        <p><label>Contraseña nueva
            <input type="password" name="newPassword" autocomplete="new-password" required minlength="10">
        </label></p>
        <p><label>Repetila
            <input type="password" name="repeatedPassword" autocomplete="new-password" required minlength="10">
        </label></p>
        <button type="submit" class="primary">Cambiar</button>
    </form>
    <p class="muted">De 10 a 72 caracteres, distinta de la actual.</p>
</main>
</body>
</html>
