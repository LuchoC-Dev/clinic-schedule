<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ingresar')}"></head>
<body>
<main style="max-width: 22rem">
    <h1>Consultorio</h1>
    <p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="ok" th:if="${param.logout}">Sesión cerrada.</p>
    <p class="ok" th:if="${param.changed}">Contraseña cambiada: ingresá con la nueva.</p>
    <p class="error" th:if="${param.expired}">Tu sesión se cerró: tu usuario fue desactivado.</p>
    <form class="card" method="post" th:action="@{/login}">
        <p><label>Usuario
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label></p>
        <p><label>Contraseña
            <input type="password" name="password" autocomplete="current-password" required>
        </label></p>
        <button type="submit" class="primary">Ingresar</button>
    </form>
</main>
</body>
</html>
