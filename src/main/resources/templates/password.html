<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contraseña')}"></head>
<body>
<!--
  No navigation here: a user whose password is temporary may reach nothing else until they change it
  (D-69), and anyone else goes back with the browser.
-->
<main style="max-width: 26rem">
    <h1>Cambiar la contraseña</h1>
    <p class="muted" th:if="${param.required}">
        Tu contraseña es temporal: la puso la administración. Elegí una propia para seguir.
    </p>
    <div th:replace="~{fragments :: messages}"></div>
    <form class="card" method="post" th:action="@{/password}">
        <p><label>Contraseña actual
            <input type="password" name="currentPassword" autocomplete="current-password" required autofocus>
        </label></p>
        <p><label><span th:text="'Contraseña nueva (' + ${minLength} + ' caracteres o más)'">Contraseña nueva</span>
            <input type="password" name="newPassword" autocomplete="new-password" required>
        </label></p>
        <p><label>Repetí la contraseña nueva
            <input type="password" name="repeatedPassword" autocomplete="new-password" required>
        </label></p>
        <button type="submit" class="primary">Cambiar</button>
    </form>
    <form method="post" th:action="@{/logout}">
        <button type="submit">Salir</button>
    </form>
</main>
</body>
</html>
