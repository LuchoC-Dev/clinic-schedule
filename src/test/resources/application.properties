# Loaded on top of application.yml for the tests only.

# The integration tests run on H2 in PostgreSQL mode, in memory, so they need nothing installed
# (D-44). Only the PostgreSQL tests (*PostgresIT) point elsewhere, at a container of their own.
spring.datasource.url=jdbc:h2:mem:schedule;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# The job that cancels overdue appointments stays off: the tests book on fixed dates, and the
# job would cancel them in the middle of a test. Its rule is tested through the use case, with a
# fixed clock, instead.
app.scheduling.enabled=false
