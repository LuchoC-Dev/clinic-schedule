# The application's database for development (D-44), and where its email goes (D-78):
# `docker compose up -d`, then run the app.
# The data lives in the named volume and survives restarts; `docker compose down -v` wipes it.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    # On 5433, not PostgreSQL's 5432: a PostgreSQL installed on the machine itself may hold that one, and would
    # answer the application in its place.
    ports:
      - "5433:5432"
    volumes:
      - schedule-data:/var/lib/postgresql

  # The reminders' email in development (D-78): it takes whatever the application sends, on port 1025,
  # shows it at http://localhost:8025, and sends nothing on.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  schedule-data:
